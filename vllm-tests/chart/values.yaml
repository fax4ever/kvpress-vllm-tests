image:
  repository: quay.io/fercoli/vllm-test
  tag: v0.18-fax
  pullPolicy: Always

huggingface:
  # REQUIRED — your HuggingFace token (for gated model access)
  token: ""

modelCache:
  enabled: true
  size: 50Gi
  # Leave empty to use the cluster default StorageClass
  storageClass: ""
  accessMode: ReadWriteOnce

gpu:
  count: 1
  # Set to true on A100+ GPUs to run all tests (including FP8, DeepGEMM)
  fullFp8Support: false
  tolerations:
    - g5-gpu
    - p4-gpu

# Size of the /dev/shm tmpfs mount (PyTorch shared memory).
# The container default (64MB) is too small for most workloads.
shmSizeLimit: 8Gi

pytest:
  # Test directories relevant to KV cache research
  testPaths:
    - tests/basic_correctness/
    - tests/kernels/attention/
    - tests/v1/core/
    - tests/v1/worker/
  # Directories to skip entirely (--ignore per entry)
  ignores: []
  # Tests excluded by name pattern (joined as: not (a or b or ...))
  filterExcludes:
    - fp8
    - FP8
    - deepgemm
    - DeepGEMM
    - test_pack_unpack_triton
    - test_triton_unified_attention
  # Per-test timeout in seconds
  timeout: 600
  # Run all tests in a single pytest process (faster, needs more VRAM)
  parallel: false
  # Stop the run after this many failures (0 = no limit)
  maxFailures: 100
  extraArgs:
    - "-v"
    - "--tb=short"
