apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runner
      restartPolicy: Never
      tolerations:
        {{- range .Values.gpu.tolerations }}
        - key: {{ . | quote }}
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        {{- end }}
      containers:
        - name: vllm-test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /vllm-workspace
          {{- if .Values.pytest.parallel }}
          command: ["pytest"]
          {{- else }}
          command: ["/vllm-workspace/run-tests.sh"]
          {{- end }}
          args:
            {{- range .Values.pytest.testPaths }}
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.pytest.ignores }}
            - "--ignore={{ . }}"
            {{- end }}
            {{- if and .Values.pytest.filterExcludes (not .Values.gpu.fullFp8Support) }}
            {{- $expr := join " or " .Values.pytest.filterExcludes }}
            - "-k"
            - {{ printf "not (%s)" $expr | quote }}
            {{- end }}
            {{- if .Values.pytest.timeout }}
            - "--timeout={{ .Values.pytest.timeout }}"
            {{- end }}
            {{- if and .Values.pytest.maxFailures (not .Values.pytest.parallel) }}
            - "--max-failures={{ .Values.pytest.maxFailures }}"
            {{- end }}
            {{- range .Values.pytest.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if .Values.huggingface.token }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hf-token
                  key: token
            {{- end }}
            {{- if .Values.modelCache.enabled }}
            - name: HF_HOME
              value: /model-cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /model-cache/huggingface/hub
            {{- end }}
            - name: VLLM_TARGET_DEVICE
              value: cuda
            - name: HOME
              value: /tmp
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count }}
          volumeMounts:
            {{- if .Values.modelCache.enabled }}
            - name: model-cache
              mountPath: /model-cache
            {{- end }}
            - name: shm
              mountPath: /dev/shm
      volumes:
        {{- if .Values.modelCache.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model-cache
        {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSizeLimit }}
