apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runner
      restartPolicy: Never
      tolerations:
        {{- range .Values.gpu.tolerations }}
        - key: {{ . | quote }}
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        {{- end }}
      containers:
        - name: kvpress-test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /kvpress-workspace
          command: ["/kvpress-workspace/run-tests.sh"]
          args:
            {{- range .Values.pytest.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: FORK_URL
              value: {{ .Values.fork.url | quote }}
            - name: FORK_BRANCH
              value: {{ .Values.fork.branch | quote }}
            {{- if .Values.huggingface.token }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hf-token
                  key: token
            {{- end }}
            {{- if .Values.modelCache.enabled }}
            - name: HF_HOME
              value: /model-cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /model-cache/huggingface/hub
            {{- end }}
            - name: HOME
              value: /tmp
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count }}
          volumeMounts:
            {{- if .Values.modelCache.enabled }}
            - name: model-cache
              mountPath: /model-cache
            {{- end }}
            - name: shm
              mountPath: /dev/shm
      volumes:
        {{- if .Values.modelCache.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model-cache
        {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSizeLimit }}
